plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    compileSdk 34

    defaultConfig {
        applicationId "com.malto4.pipdroid"
        // 19 -> 21 (карта, ветка app-map): импорт бандла карты идёт через SAF-пикер папки
        // (ACTION_OPEN_DOCUMENT_TREE), который требует API 21. Прецедент подъёма minSdk уже
        // был (18 -> 19, ради библиотеки визуализатора) — тот же случай.
        minSdk 21
        targetSdk 34
        versionCode 12
        versionName "2.0.12"
        multiDexEnabled = true

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        viewBinding {
            enabled = true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        viewBinding true
    }
    sourceSets {
        main {
            assets {
                srcDirs 'src\\main\\assets'
            }
        }
    }
}

dependencies {

    implementation 'androidx.core:core-ktx:1.6.0'
    implementation 'androidx.appcompat:appcompat:1.3.1'
    implementation 'androidx.core:core:1.6.0'
    implementation 'com.google.android.material:material:1.6.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.navigation:navigation-fragment-ktx:2.4.2'
    implementation 'androidx.navigation:navigation-ui-ktx:2.4.2'
    implementation 'androidx.datastore:datastore-preferences:1.0.0'
    // DocumentFile.fromTreeUri() для импорта бандла карты через SAF-пикер папки
    // (MapBundleRepository) — уже была транзитивной зависимостью (через core/appcompat),
    // объявляем явно раз используем её API напрямую.
    implementation 'androidx.documentfile:documentfile:1.0.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.5.0'
    implementation 'com.github.chrisbanes:PhotoView:2.3.0'
    implementation 'com.github.bumptech.glide:glide:4.12.0'
    implementation("io.github.gautamchibde:audiovisualizer:2.2.7")
    // Голосовые команды (roadmap, этап 19) — локальный инференс wake-word по схеме
    // openWakeWord (melspectrogram -> embedding -> classifier), три ONNX-модели в
    // assets/models/wakeword/. Заглушка на английской модели hey_jarvis, пока не обучена
    // своя под "Пип-бой" (обучение вне этого репозитория, licenses/openWakeWord-models.txt).
    // ONNX Runtime, не TFLite — TFLite-экспорт этих же моделей падает на Android Java API
    // ("BytesRequired number of elements overflowed" из-за динамической оси входа, известный
    // нерешённый баг апстрима, dscripka/openWakeWord issue #223), .onnx-версии тех же файлов
    // от того же релиза этой проблемы не имеют.
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.19.2'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.12.0'
    implementation 'com.google.code.gson:gson:2.8.8'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'

}